name: website

services:
  web:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: website-web
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,nodev,size=1m,uid=101,gid=101
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8088:8080"
    networks:
      - web
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 100
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    name: website_net
    driver: bridge
