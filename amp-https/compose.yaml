name: amp-https

# TLS reverse proxy for the AMP panel (AMP itself listens on 127.0.0.1:8080 only).
services:
  proxy:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: amp-https
    restart: unless-stopped
    network_mode: host
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,nodev,size=1m,uid=101,gid=101
    volumes:
      - ./nginx/amp.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 100
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
